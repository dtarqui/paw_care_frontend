<!-- Logo de PawCare: la misma patita del ícono de la PWA (pwa-icon.svg), a la que
     este archivo tiene que coincidir — es la marca en la pestaña del navegador.
     Antes había acá el logo de la plantilla de arranque (un rayo violeta), que no
     tenía nada que ver con el producto y se veía en cada captura y cada grabación. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#7c3aed"/>
  <g fill="#ffffff">
    <ellipse cx="50" cy="66" rx="20" ry="16"/>
    <circle cx="28" cy="38" r="9"/>
    <circle cx="50" cy="26" r="9"/>
    <circle cx="72" cy="38" r="9"/>
  </g>
</svg>
